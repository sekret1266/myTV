name: Auto Update IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-browser-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачиваем файлы
        uses: actions/checkout@v4

      - name: Включаем Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Устанавливаем библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Запускаем парсер
        run: python parser.py

      - name: Сохраняем результат в репозиторий
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git commit -m "Auto-update playlist.m3u [skip ci]" || echo "Нет изменений для коммита"
          git push

      - name: Загружаем скриншот ошибки (если он есть)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screen
          path: error_screen.png
