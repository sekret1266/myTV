name: Auto Update IPTV

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  run-browser-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Скачиваем файлы репозитория
      uses: actions/checkout@v4

    - name: Включаем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеки и браузер
      run: |
        pip install playwright
        playwright install chromium --with-deps

    - name: Запускаем виртуальный кликер
      run: python parser.py

    - name: Сохраняем обновленный плейлист на GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add playlist.m3u
        git commit -m "Плейлист автоматически обновлен" || exit 0
        git push

